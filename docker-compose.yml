version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: namma_space_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/static:/app/static
      - ./backend/namma_space.db:/app/namma_space.db
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./namma_space.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: namma_space_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
